<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Library</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#0f1115;color:#fff;min-height:100vh}
header{padding:55px 20px 40px;text-align:center;border-bottom:1px solid #252932}
header h1{font-size:clamp(28px,5vw,46px);margin-bottom:10px}
header p{color:#9da3ae;font-size:15px}
.container{width:min(1000px,92%);margin:35px auto}
.search{width:100%;padding:15px 18px;border:1px solid #30343d;border-radius:12px;background:#181b21;color:#fff;font-size:15px;outline:none;margin-bottom:25px}
.search:focus{border-color:#666}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:#181b21;border:1px solid #292d35;border-radius:16px;padding:22px;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#4a4f59}
.icon{width:52px;height:52px;border-radius:12px;background:#fff;color:#111;display:grid;place-items:center;font-weight:800;font-size:13px;margin-bottom:18px}
h2{font-size:19px;margin-bottom:8px}
.desc{color:#9da3ae;font-size:14px;line-height:1.5;margin-bottom:20px}
.buttons{display:flex;gap:10px}
.btn{flex:1;text-align:center;text-decoration:none;padding:11px;border-radius:9px;font-size:14px;font-weight:700}
.view{color:#fff;border:1px solid #3a3f48}
.download{background:#fff;color:#111}
.view:hover{background:#252932}.download:hover{background:#ddd}
.empty{display:none;text-align:center;color:#888;padding:40px}
footer{text-align:center;color:#666;font-size:13px;padding:40px 20px}
@media(max-width:500px){.buttons{flex-direction:column}}
</style>
</head>
<body>

<header>
    <h1>PDF Library</h1>
    <p>View and download documents</p>
</header>

<main class="container">
    <input class="search" id="search" type="search" placeholder="Search documents...">

    <section class="grid" id="pdfList">

        <!-- Add more PDF cards below -->
        <article class="card" data-name="2588">
            <div class="icon">PDF</div>
            <h2>2588 (1)</h2>
            <p class="desc">PDF document available for viewing and download.</p>

            <div class="buttons">
                <a class="btn view" href="pdfs/2588%20%281%29.pdf" target="_blank" rel="noopener">
                    View
                </a>
                <a class="btn download" href="pdfs/2588%20%281%29.pdf" download>
                    Download
                </a>
            </div>
        </article>

    </section>

    <div class="empty" id="empty">No PDF found.</div>
</main>

<footer>© 2026 PDF Library</footer>

<script>
const search = document.getElementById("search");
const cards = [...document.querySelectorAll(".card")];
const empty = document.getElementById("empty");

search.addEventListener("input", () => {
    const value = search.value.toLowerCase().trim();
    let visible = 0;

    cards.forEach(card => {
        const match = card.dataset.name.toLowerCase().includes(value);
        card.style.display = match ? "" : "none";
        if (match) visible++;
    });

    empty.style.display = visible ? "none" : "block";
});
</script>

</body>
</html>
